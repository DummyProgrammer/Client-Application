<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Genesys OAuth Test Widget</title>

    <!-- Genesys Cloud Platform Client SDK -->
    <script src="https://sdk-cdn.mypurecloud.com/javascript/latest/purecloud-platform-client-v2.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 16px;
            border-radius: 8px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            margin-right: 8px;
        }

        .section {
            margin-top: 20px;
        }

        #status,
        #presence {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h3>Genesys OAuth Test</h3>

    <!-- Authentication -->
    <div class="section">

        <button id="loginButton">
            Authenticate to Genesys
        </button>

        <div id="status">
            Not authenticated
        </div>

    </div>


    <!-- Presence -->
    <div class="section">

        <h4>Current User Presence</h4>

        <button id="presenceButton" disabled>
            Get Presence
        </button>

        <div id="presence">
            Authenticate first.
        </div>

    </div>

</div>


<script>

    // ============================================================
    // Configuration
    // ============================================================

    const clientId = '9d9b5378-2f8f-4196-b1fb-43634adb2736';

    const redirectUri =
        window.location.origin +
        window.location.pathname;


    // ============================================================
    // Genesys Platform Client
    // ============================================================

    const platformClient = require('platformClient');

    const client = platformClient.ApiClient.instance;


    // ============================================================
    // Genesys Cloud Region
    // ============================================================

    // US West 2
    client.setEnvironment(
        platformClient.PureCloudRegionHosts.us_west_2
    );

    //Persist Session
    client.setPersistSettings(true);

    // ============================================================
    // API instances
    // ============================================================

    const usersApi = new platformClient.UsersApi();


    // ============================================================
    // UI elements
    // ============================================================

    const loginButton =
        document.getElementById('loginButton');

    const presenceButton =
        document.getElementById('presenceButton');

    const status =
        document.getElementById('status');

    const presence =
        document.getElementById('presence');


    // ============================================================
    // Helper
    // ============================================================

    function setStatus(element, message, type) {

        element.textContent = message;

        element.className = type || '';

    }


    // ============================================================
    // Authenticate
    // ============================================================

    async function authenticate() {

        setStatus(
            status,
            'Opening Genesys authentication...'
        );

        try {

            const data =
                await client.loginImplicitGrant(
                    clientId,
                    redirectUri,
                    {
                        state: 'widget-auth-test',
                        provider: "",
                        org: "",

                        authPopupConfiguration: {
                            usePopup: true
                        }
                    }
                );


            console.log(
                'Implicit grant response:',
                data
            );


            console.log(
                'Access token:',
                client.authData.accessToken
            );


            setStatus(
                status,
                'Authenticated successfully!',
                'success'
            );


            // Enable presence button
            presenceButton.disabled = false;


            // Automatically retrieve presence
            await getPresence();


        } catch (error) {

            console.error(
                'Genesys authentication failed:',
                error
            );


            setStatus(
                status,
                'Authentication failed:\n\n' +
                formatError(error),
                'error'
            );

        }

    }


    // ============================================================
    // Get Current User Presence
    // ============================================================

    async function getPresence() {

        setStatus(
            presence,
            'Getting current user presence...'
        );

        try {

            /*
             * This uses the access token/session that was
             * established by loginImplicitGrant().
             *
             * GET /api/v2/users/me?expand=presence
             */

            const userMe =
                await usersApi.getUsersMe({
                    expand: ['presence']
                });


            console.log(
                'Users/me response:',
                userMe
            );


            // ----------------------------------------------------
            // Display useful presence information
            // ----------------------------------------------------

            const presenceObject =
                userMe.presence;


            if (presenceObject) {

                setStatus(
                    presence,
                    JSON.stringify(
                        {
                            userId: userMe.id,
                            userName: userMe.name,
                            presence: presenceObject
                        },
                        null,
                        2
                    ),
                    'success'
                );

            } else {

                setStatus(
                    presence,
                    'API call succeeded, but no presence object was returned.\n\n' +
                    JSON.stringify(
                        userMe,
                        null,
                        2
                    )
                );

            }


        } catch (error) {

            console.error(
                'Presence API failed:',
                error
            );


            setStatus(
                presence,
                'Presence API request failed:\n\n' +
                formatError(error),
                'error'
            );

        }

    }


    // ============================================================
    // Error formatting
    // ============================================================

    function formatError(error) {

        if (!error) {
            return 'Unknown error';
        }


        /*
         * The SDK error can contain useful fields such as:
         *
         * status
         * message
         * body
         * response
         */

        if (typeof error === 'string') {
            return error;
        }


        return JSON.stringify(
            error,
            Object.getOwnPropertyNames(error),
            2
        );

    }


    // ============================================================
    // Event handlers
    // ============================================================

    loginButton.addEventListener(
        'click',
        authenticate
    );


    presenceButton.addEventListener(
        'click',
        getPresence
    );

</script>

</body>
</html>
